name: Audit source release

on:
  push:
    tags: ['engage-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/check_content.py
      - name: Audit the exact checked-out commit
        run: python tools/make_engage_source_release.py --ref HEAD --out build/source-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engage-source-preview
          path: |
            build/source-release/*-source.zip
            build/source-release/SHA256SUMS
            build/source-release/source-inventory.json
          if-no-files-found: error
