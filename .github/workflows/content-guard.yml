name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/check_content.py
      - run: python -m pip install -r tools/requirements-engage-lifter.txt
      - run: python -m unittest discover -s tests -p "engage*_test.py"
      - run: python tests/extract_engage_test.py
      - run: python tests/continuations_test.py

  setup-window:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -p "engage_setup_test.py"
      - run: python -m engage_setup.gui --selftest
